[project]
site_name = "site-nine documentation"
site_url = "http://dusktreader.github.io/site-nine"
docs_dir = "source"
repo_url = "https://github.com/dusktreader/site-nine"
extra_css = ["stylesheets/extra.css"]
nav = [
  {"Home" = "index.md"},
  {"Quickstart" = "quickstart.md"},
  {"OpenCode Integration" = "opencode-integration.md"},
  {"Working with Agents" = [
    {"Overview" = "agents/overview.md"},
    {"Possessions" = "agents/possessions.md"},
    {"Roles" = "agents/roles.md"},
    {"Daemons" = "agents/daemons.md"},
  ]},
  {"Epics" = [
    {"Overview" = "epics/overview.md"},
    {"Planning" = "epics/planning.md"},
    {"Tracking Progress" = "epics/tracking.md"},
    {"Epic Files" = "epics/files.md"},
  ]},
  {"CLI Reference" = [
    {"Overview" = "cli/overview.md"},
    {"For Humans" = "cli/for-humans.md"},
    {"For Agents" = "cli/for-agents.md"},
    {"Complete Reference" = "cli/complete.md"},
  ]},
  {"Directory Structure" = "structure.md"},
  {"Advanced Topics" = "advanced.md"},
  {"Glossary" = "glossary.md"},
]

[project.theme]
variant = "classic"
features = [
  "navigation.expand",
  "navigation.footer",
  "navigation.tracking",
  "content.code.copy",
]

[project.theme.font]
code = "Fira Code"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Light mode palette
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# Dark mode palette
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.plugins.search]
lang = "en"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = [".."]

[project.plugins.mkdocstrings.handlers.python.options]
heading_level = 3
show_root_heading = true
separate_signature = true
show_signature_annotations = true
show_source = false
docstring_style = "google"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.snippets"]

[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.blocks.caption"]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
